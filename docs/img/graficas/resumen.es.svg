<text x="209.0" y="146.0" class="t2" font-size="12">más rápido en abrir</text>
<text x="209.0" y="164.0" class="t2" font-size="12">la ventana que Obsidian</text>
<text x="209.0" y="182.0" class="t2" font-size="12">(nota sencilla)</text>
<text x="209.0" y="200.0" class="t2" font-size="12">148 frente a 360 ms</text>
