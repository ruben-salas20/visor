<rect class="fondo" x="0" y="0" width="720" height="331" rx="8"/>
<text x="24.0" y="32.0" class="t1" font-size="18" font-weight="600">visor usa menos memoria y arranca antes que Obsidian y Chromium</text>
<text x="24.0" y="54.0" class="t2" font-size="13">Cifras clave de la nota sencilla y de la página suelta · Menos es mejor</text>
