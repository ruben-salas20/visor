<svg xmlns="http://www.w3.org/2000/svg" width="720" height="358" viewBox="0 0 720 358" role="img" aria-labelledby="t d">
<title id="t">visor uses less memory and starts faster than Obsidian and Chromium</title>
<desc id="d">visor uses less memory and starts faster than Obsidian and Chromium. Key figures for the simple note and the loose page · Less is better</desc>
<style>
text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}
.fondo{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.rej{stroke:#e1e0d9;stroke-width:1}.eje{stroke:#c3c2b7;stroke-width:1}.acento{fill:#2a78d6}.neutro{fill:#898781}.neutro-claro{fill:#52514e}.trama{stroke:#1c5cab}.trama-fondo{fill:#9ec5f4}.bigote{stroke:#0b0b0b;stroke-width:1.5}.halo{stroke:#fcfcfb;stroke-width:5}.knock{stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}.tarjeta{fill:none;stroke:#e1e0d9;stroke-width:1}
@media (prefers-color-scheme: dark){.fondo{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.rej{stroke:#2c2c2a;stroke-width:1}.eje{stroke:#383835;stroke-width:1}.acento{fill:#3987e5}.neutro{fill:#898781}.neutro-claro{fill:#c3c2b7}.trama{stroke:#86b6ef}.trama-fondo{fill:#184f95}.bigote{stroke:#ffffff;stroke-width:1.5}.halo{stroke:#1a1a19;stroke-width:5}.knock{stroke:#1a1a19;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}.tarjeta{fill:none;stroke:#2c2c2a;stroke-width:1}}
</style>
<defs><pattern id="trama" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect class="trama-fondo" width="6" height="6"/><line class="trama" x1="0" y1="0" x2="0" y2="6" stroke-width="2.5"/></pattern></defs>
<rect class="fondo" x="0" y="0" width="720" height="358" rx="8"/>
<text x="24.0" y="32.0" class="t1" font-size="18" font-weight="600">visor uses less memory and starts faster than Obsidian and Chromium</text>
<text x="24.0" y="54.0" class="t2" font-size="13">Key figures for the simple note and the loose page · Less is better</text>
<g transform="translate(0,0)">
<rect x="24.0" y="76" width="159.0" height="160" rx="8" class="tarjeta"/>
<text x="38.0" y="116.0" class="t1" font-size="28" font-weight="700">1.9×</text>
<text x="38.0" y="146.0" class="t2" font-size="12">less memory than</text>
<text x="38.0" y="164.0" class="t2" font-size="12">Obsidian</text>
<text x="38.0" y="182.0" class="t2" font-size="12">(simple note)</text>
<text x="38.0" y="200.0" class="t2" font-size="12">216 vs 413 MB</text>
<rect x="195.0" y="76" width="159.0" height="160" rx="8" class="tarjeta"/>
<text x="209.0" y="116.0" class="t1" font-size="28" font-weight="700">2.4×</text>
<text x="209.0" y="146.0" class="t2" font-size="12">faster to open its</text>
<text x="209.0" y="164.0" class="t2" font-size="12">window than</text>
<text x="209.0" y="182.0" class="t2" font-size="12">Obsidian</text>
<text x="209.0" y="200.0" class="t2" font-size="12">(simple note)</text>
<text x="209.0" y="218.0" class="t2" font-size="12">148 vs 360 ms</text>
<rect x="366.0" y="76" width="159.0" height="160" rx="8" class="tarjeta"/>
<text x="380.0" y="116.0" class="t1" font-size="28" font-weight="700">2.3×</text>
<text x="380.0" y="146.0" class="t2" font-size="12">faster to open its</text>
<text x="380.0" y="164.0" class="t2" font-size="12">window than</text>
<text x="380.0" y="182.0" class="t2" font-size="12">Chromium</text>
<text x="380.0" y="200.0" class="t2" font-size="12">(loose page)</text>
<text x="380.0" y="218.0" class="t2" font-size="12">144 vs 328 ms</text>
<rect x="537.0" y="76" width="159.0" height="160" rx="8" class="tarjeta"/>
<text x="551.0" y="116.0" class="t1" font-size="28" font-weight="700">0.07 %</text>
<text x="551.0" y="146.0" class="t2" font-size="12">visor CPU at rest</text>
<text x="551.0" y="164.0" class="t2" font-size="12">(simple note)</text>
<text x="551.0" y="182.0" class="t2" font-size="12">Obsidian: 1.13 %</text>
<line x1="24" y1="262" x2="696" y2="262" class="rej"/>
<text x="24.0" y="276.0" class="t2" font-size="12">Figures computed from the medians in cifras.json.</text>
<text x="24.0" y="293.0" class="t2" font-size="12">A ratio under 1.2× is shown as a number, without “less”.</text>
<text x="24.0" y="310.0" class="t2" font-size="12">Data of 2026-10-10 · plugged in, performance profile, 5 rounds, Intel Core i7-13620H, 23.1 GiB</text>
<text x="24.0" y="327.0" class="t2" font-size="12">Versions: visor 7b7db2b · Obsidian 1.14.4 · Chromium 152.0.7977.82</text>
</g>
</svg>
