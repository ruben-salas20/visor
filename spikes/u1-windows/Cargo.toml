[package]
name = "u1-windows"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prototipo U1 en Windows (issue 35): marco HTML y dos páginas en webviews hijos de una ventana winit"

# Own workspace: this spike is not a member of the visor workspace.
[workspace]

[dependencies]
winit = "0.30"
wry = "0.57.0"
serde_json = "1"

# Same versions as spikes/w2-webviews and spikes/w3-committed (pinned by wry 0.57).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
