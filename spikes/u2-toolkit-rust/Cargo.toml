[package]
name = "u2-toolkit-rust"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimento U2 (issue 35): ¿un webview de wry cabe dentro de una ventana de egui o slint en Wayland?"

# Proyecto independiente: no es miembro del crate raíz de visor.
[workspace]

[dependencies]
wry = "0.57.0"
raw-window-handle = "0.6"
gtk = "0.18"
eframe = "0.33"
slint = { version = "1", features = ["unstable-winit-030"] }
