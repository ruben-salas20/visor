<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>marco</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 14px sans-serif; overflow: hidden; }
  #barra { position: fixed; left: 0; top: 0; right: 0; height: 40px; background: #d8d2c4; }
  #lado { position: fixed; left: 0; top: 40px; width: 200px; bottom: 0; background: #e8e4da; }
  /* The hole is transparent: the page below shows through it. */
  #hueco { position: fixed; left: 200px; top: 40px; right: 0; bottom: 0; }
  #ajustes { position: absolute; left: 10px; top: 5px; width: 100px; height: 30px; }
  #nota { position: absolute; left: 20px; top: 20px; width: 160px; height: 30px; background: #c9bfa8; line-height: 30px; text-align: center; }
  #menu { display: none; position: fixed; left: 220px; top: 44px; width: 240px; background: #2b5797; color: #fff;
          border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
  #menu div { height: 40px; line-height: 40px; padding-left: 12px; }
</style></head>
<body>
<div id="barra"><button id="ajustes">Ajustes</button></div>
<div id="lado"><div id="nota" draggable="true">nota.md</div></div>
<div id="hueco"></div>
<div id="menu"><div>Tema</div><div>Tamaño de letra</div><div>Atajos</div><div>Bóveda</div><div>Acerca de</div></div>
<script>
  const post = (m) => window.ipc.postMessage(JSON.stringify(m));
  const caja = (el) => { const r = el.getBoundingClientRect(); return [r.left, r.top, r.width, r.height].map(Math.round); };
  const menu = document.getElementById('menu');
  const abierto = () => menu.style.display === 'block';
  const estado = () => post({ tipo: 'estado', ventana: [innerWidth, innerHeight], huecos: [caja(document.getElementById('hueco'))],
                              solidos: abierto() ? [caja(menu)] : [], escala: devicePixelRatio });
  const abrir = (si) => { menu.style.display = si ? 'block' : 'none'; post({ tipo: 'menu', abierto: si }); estado(); };
  document.getElementById('ajustes').onclick = (e) => { e.stopPropagation(); abrir(!abierto()); };
  [...menu.children].forEach((d, n) => d.onclick = (e) => { e.stopPropagation(); post({ tipo: 'item', n }); abrir(false); });
  document.addEventListener('click', (e) => post({ tipo: 'clic-marco', x: e.clientX, y: e.clientY }));
  // A click in the page moves the focus there: the frame loses it and closes its menus.
  window.addEventListener('blur', () => { if (abierto()) { post({ tipo: 'cerrado-por-foco' }); abrir(false); } });
  document.addEventListener('keydown', (e) => post({ tipo: 'tecla-marco', key: e.key }));
  document.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', 'nota.md'); post({ tipo: 'arrastre-empieza' }); });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => { e.preventDefault(); post({ tipo: 'soltar-en-marco', x: e.clientX, y: e.clientY }); });
  addEventListener('resize', estado);
  window.__marco = { abrir };
  post({ tipo: 'listo' });
  estado();
</script>
</body></html>
