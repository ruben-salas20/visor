[package]
name = "menus-encima"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prototipo (issue 35): menús del marco encima de páginas vivas"

# Own workspace: this spike is not a member of the visor workspace.
[workspace]

[dependencies]
wry = "0.57.0"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
tao = "0.37.1"
gtk = "0.18"
webkit2gtk = "2.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(windows)'.dependencies]
winit = "0.30"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
