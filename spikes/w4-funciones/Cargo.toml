[package]
name = "w4-funciones"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prototipo W4 en Windows (issue 35): siete funciones de WebView2 que wry 0.57 no da"

# Own workspace: this spike is not a member of the visor workspace.
[workspace]

[dependencies]
winit = "0.30"
wry = "0.57.0"
serde_json = "1"
png = "0.17"

# Same versions as spikes/u1-windows (pinned by wry 0.57). `windows` 0.62 is the crate
# webview2-com-sys uses: CapturePreview needs its IStream.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
