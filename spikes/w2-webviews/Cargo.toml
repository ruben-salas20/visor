[package]
name = "w2-webviews"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimento W2 (issue 35): coste de N webviews hijos de WebView2 en una ventana"

# Proyecto independiente: no es miembro del crate raíz de visor.
[workspace]

[dependencies]
tao = "0.37.1"
wry = "0.57.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
webview2-com = "0.39"
