# Flatpak of visor, built by .github/workflows/release.yml.
id: io.github.ruben_salas20.visor
runtime: org.gnome.Platform
# The GNOME runtime brings WebKitGTK 4.1; 51 is the one proven in L5.
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: visor
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/visor/cargo
  # cargo downloads the crates here. Flathub builds offline: it will need them vendored.
  build-args:
    - --share=network
modules:
  - name: visor
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/visor /app/bin/visor
      - sed 's/^Icon=visor$/Icon=io.github.ruben_salas20.visor/' packaging/linux/visor.desktop > io.github.ruben_salas20.visor.desktop
      - install -Dm644 io.github.ruben_salas20.visor.desktop /app/share/applications/io.github.ruben_salas20.visor.desktop
      - install -Dm644 docs/img/logo/simbolo.svg /app/share/icons/hicolor/scalable/apps/io.github.ruben_salas20.visor.svg
    sources:
      - type: dir
        path: ../..
