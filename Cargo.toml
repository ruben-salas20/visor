[package]
name = "visor"
version = "0.3.0-rc.2"
edition = "2024"
# let chains (`if let … && …`) need 1.88; File::try_lock, 1.89.
rust-version = "1.89"
description = "Visor de bóvedas de HTML y Markdown para estudiar con IA"
license = "MIT"
publish = false
# Two binaries: visor, and visorw (src/bin/visorw.rs), which only Windows ships.
default-run = "visor"

[dependencies]
dirs = "7.0.0"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
notify = "8.2"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
wry = "0.57.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Brotli at maximum quality is slow unoptimized; this only affects the build.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[build-dependencies]
brotli = "9.0.0"

# The icon of visor.exe and visorw.exe (packaging/windows/visor.rc).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

# The window and its webviews: tao and WebKitGTK on Linux, winit and WebView2 on Windows (docs/adr/0040).
[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
gtk = "0.18"
tao = "0.37.1"
# Must match the version wry pins (docs/adr/0033).
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target."cfg(windows)".dependencies]
# The versions wry 0.57 pins; `windows` with features wry already enables.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.62"
winit = "0.30"
getrandom = "0.4.3"
sha2 = "0.11.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

# The .deb that .github/workflows/release.yml builds with cargo-deb, on Debian 12.
[package.metadata.deb]
maintainer = "Ruben Salas <rubend.salasp@uqvirtual.edu.co>"
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/visor", "usr/bin/", "755"],
    ["packaging/linux/visor.desktop", "usr/share/applications/", "644"],
    ["docs/img/logo/simbolo.svg", "usr/share/icons/hicolor/scalable/apps/visor.svg", "644"],
]
