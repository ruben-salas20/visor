[package]
name = "visor"
version = "0.1.0"
edition = "2024"
# let chains (`if let … && …`) need 1.88.
rust-version = "1.88"
description = "Visor de bóvedas de HTML y Markdown para estudiar con IA"
license = "MIT"
publish = false

[dependencies]
dirs = "7.0.0"
gtk = "0.18"
notify = "8.2"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37.1"
tiny_http = "0.12.0"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
wry = "0.57.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Brotli at maximum quality is slow unoptimized; this only affects the build.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[build-dependencies]
brotli = "9.0.0"
