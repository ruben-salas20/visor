<!doctype html>
<!--
  Intro animation for the README GIF. Parameters (all optional):
    ?lang=es|en          text language (default es)
    &logo=<url>          symbol image (default docs/img/logo/simbolo-oscuro.svg)
    &datos=<url>         figures JSON (default docs/img/cifras.json, then cifras.ejemplo.json)
    &t=<seconds>         freeze at that moment (for checking one frame)
  Time is a pure function: window.intro.render(t). grabar.mjs drives it frame by frame,
  so nothing depends on the real clock. Without the recorder it plays by itself.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=960, height=540">
<title>visor · intro</title>
<style>
  :root {
    --fondo: #1a1c21;
    --texto: #e9e7e2;
    --suave: #9a9890;
    --acento: #e8b54d;
    --marca: rgba(232, 181, 77, 0.32);
  }
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: var(--fondo); }
  body {
    font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
  }
  #escena { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .capa { position: absolute; left: 0; right: 0; display: flex; justify-content: center; will-change: transform, opacity; }

  #firma { top: 0; height: 540px; align-items: center; gap: 22px; }
  #simbolo { width: 84px; height: 84px; display: block; object-fit: contain; }
  #marcador { width: 84px; height: 84px; display: none; }
  #nombre { font-size: 84px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; padding-bottom: 10px; }

  #lema { top: 335px; font-size: 27px; font-weight: 400; color: var(--texto); letter-spacing: -0.005em; }
  #lema mark { position: relative; background: none; color: inherit; padding: 0 3px; }
  #lema mark::before {
    content: ""; position: absolute; left: 0; bottom: 3px; height: 0.55em;
    width: calc(var(--trazo, 0) * 100%); background: var(--marca); border-radius: 2px; z-index: -1;
  }
  #lema span { position: relative; z-index: 0; }

  #cifras { top: 302px; }
  .cifra { box-sizing: border-box; width: 270px; padding: 0 24px; text-align: center; border-left: 1px solid rgba(233, 231, 226, 0.12); }
  .cifra:first-child { border-left: none; }
  .num { font-size: 54px; font-weight: 700; letter-spacing: -0.03em; color: var(--acento); line-height: 1.05; font-variant-numeric: tabular-nums; }
  .que { font-size: 19px; margin-top: 6px; line-height: 1.3; min-height: 2.6em; }
  .detalle { font-size: 15px; margin-top: 8px; color: var(--suave); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="escena">
  <div class="capa" id="firma">
    <img id="simbolo" alt="">
    <svg id="marcador" viewBox="0 0 84 84" aria-hidden="true">
      <rect x="3" y="3" width="78" height="78" rx="20" fill="none" stroke="#e8b54d" stroke-width="5"/>
      <rect x="22" y="48" width="40" height="10" rx="3" fill="#e8b54d" opacity="0.55"/>
      <rect x="22" y="28" width="40" height="6" rx="3" fill="#e9e7e2" opacity="0.8"/>
    </svg>
    <div id="nombre">visor</div>
  </div>
  <div class="capa" id="lema"></div>
  <div class="capa" id="cifras"></div>
</div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") === "en" ? "en" : "es";
  document.documentElement.lang = lang;

  const TEXTOS = {
    es: {
      lema: ["Lee, ", "subraya", " y pregunta a tu IA, en tus propios archivos"],
      memoria: "menos memoria que Obsidian",
      arranque: "más rápido en abrir la ventana que Obsidian",
      tamano: "menos disco que Chromium, con su motor",
      frente: "frente a",
    },
    en: {
      lema: ["Read, ", "highlight", " and ask your AI, in your own files"],
      memoria: "less memory than Obsidian",
      arranque: "faster to open its window than Obsidian",
      tamano: "less disk than Chromium, engine included",
      frente: "vs",
    },
  };
  const T = TEXTOS[lang];

  // Timeline, in seconds. Ends on a clean background frame so a screen capture can follow.
  const DURACION = 8.0;
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const tramo = (t, a, b) => clamp((t - a) / (b - a));
  const suave = (x) => 1 - Math.pow(1 - x, 3);                 // easeOutCubic
  const ida = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2); // easeInOutCubic

  const $ = (id) => document.getElementById(id);
  const firma = $("firma"), simbolo = $("simbolo"), marcador = $("marcador"), nombre = $("nombre");
  const lema = $("lema"), cifras = $("cifras"), escena = $("escena");

  // One inline wrapper: as direct flex items the spaces around <mark> would be dropped.
  const linea = document.createElement("div");
  T.lema.forEach((parte, i) => {
    const el = document.createElement(i === 1 ? "mark" : "span");
    if (i === 1) el.innerHTML = "<span></span>";
    (i === 1 ? el.firstChild : el).textContent = parte;
    linea.appendChild(el);
  });
  lema.replaceChildren(linea);
  const marca = lema.querySelector("mark");

  const nf = (max) => new Intl.NumberFormat(lang, { maximumFractionDigits: max });
  // Below 2× a percentage reads better ("30 % menos") than "1,4×".
  const veces = (x, menos) =>
    x < 2 ? (menos ? nf(0).format(Math.round((1 - 1 / x) * 100)) : nf(0).format(Math.round((x - 1) * 100))) + " %"
    : (x >= 10 ? nf(0).format(Math.round(x)) : nf(1).format(x)) + "×";
  const mb = (x) => (x >= 10 ? nf(0).format(x) : nf(1).format(x)) + " MB";
  const seg = (ms) => nf(ms < 1000 ? 2 : 1).format(ms / 1000) + " s";

  function construirCifras(d) {
    const m = d.medidas, s = d.tamano_mb;
    const memV = m.visor.minima.memoria_mb.mediana, memO = m.obsidian.minima.memoria_mb.mediana;
    const arrV = m.visor.minima.arranque_ms.mediana, arrO = m.obsidian.minima.arranque_ms.mediana;
    // visor needs the system WebKitGTK: count each engine, or the comparison is unfair.
    const total = (x) => x.app + (x.motor || 0);
    const tamV = total(s.visor), tamC = total(s.chromium);
    const filas = [
      [veces(memO / memV, true), T.memoria, `${mb(memV)} ${T.frente} ${mb(memO)}`],
      [veces(arrO / arrV), T.arranque, `${seg(arrV)} ${T.frente} ${seg(arrO)}`],
      [veces(tamC / tamV, true), T.tamano, `${mb(tamV)} ${T.frente} ${mb(tamC)}`],
    ];
    cifras.innerHTML = "";
    for (const [n, que, det] of filas) {
      const c = document.createElement("div");
      c.className = "cifra";
      c.innerHTML = `<div class="num"></div><div class="que"></div><div class="detalle"></div>`;
      c.children[0].textContent = n;
      c.children[1].textContent = que;
      c.children[2].textContent = det;
      cifras.appendChild(c);
    }
  }

  function render(t) {
    // 1. Symbol and name, centred.
    const aS = suave(tramo(t, 0.3, 1.1));
    const aN = suave(tramo(t, 0.6, 1.4));
    // 3. The whole signature moves up to make room for the figures.
    const sube = ida(tramo(t, 2.9, 3.6));
    firma.style.transform = `translateY(${-140 * sube}px) scale(${1 - 0.28 * sube})`;
    for (const el of [simbolo, marcador]) {
      el.style.opacity = aS;
      el.style.transform = `scale(${0.9 + 0.1 * aS})`;
    }
    nombre.style.opacity = aN;
    nombre.style.transform = `translateX(${(1 - aN) * -14}px)`;

    // 2. Tagline, then the highlight sweeps under the key word.
    const aL = suave(tramo(t, 1.5, 2.2));
    lema.style.opacity = aL;
    lema.style.transform = `translateY(${(1 - aL) * 12 - 130 * sube}px)`;
    marca.style.setProperty("--trazo", ida(tramo(t, 2.1, 2.7)).toFixed(4));

    // 3. Figures, one by one.
    [...cifras.children].forEach((c, i) => {
      const a = suave(tramo(t, 3.4 + 0.6 * i, 4.0 + 0.6 * i));
      c.style.opacity = a;
      c.style.transform = `translateY(${(1 - a) * 16}px)`;
    });

    // 4. Exit: everything shrinks a little and fades to the plain background.
    const fin = ida(tramo(t, 6.7, 7.4));
    escena.style.opacity = 1 - fin;
    escena.style.transform = `scale(${1 - 0.05 * fin})`;
  }

  async function cargarDatos() {
    const pedidas = q.get("datos")
      ? [q.get("datos")]
      : ["../../docs/img/cifras.json", "../../docs/img/cifras.ejemplo.json"];
    for (const url of pedidas) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (r.ok) return await r.json();
      } catch (_) {}
    }
    throw new Error("No encuentro las cifras: " + pedidas.join(", "));
  }

  function cargarSimbolo() {
    return new Promise((ok) => {
      simbolo.onload = () => ok();
      simbolo.onerror = () => {
        simbolo.style.display = "none";
        marcador.style.display = "block";
        ok();
      };
      simbolo.src = q.get("logo") || "../../docs/img/logo/simbolo-oscuro.svg";
    });
  }

  const listo = (async () => {
    construirCifras(await cargarDatos());
    await cargarSimbolo();
    await document.fonts.ready;
  })();

  window.intro = { DURACION, render, listo };

  listo.then(() => {
    if (q.has("t")) return render(Number(q.get("t")));
    if (q.has("grabar")) return render(0);
    const t0 = performance.now();
    const paso = (now) => {
      render(((now - t0) / 1000) % (DURACION + 1));
      requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }, (e) => {
    document.body.textContent = e.message;
    document.body.style.cssText += "color:#e9e7e2;font:16px monospace;padding:24px";
  });
})();
</script>
</body>
</html>
