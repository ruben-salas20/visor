<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Test</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 60ch; margin: 40px auto; padding: 0 24px;
         background: var(--visor-bg, #fff); color: var(--visor-fg, #222); }
  button { display: block; width: 100%; margin: 8px 0; padding: 10px 14px; text-align: left; font: inherit;
           border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
           background: none; color: inherit; cursor: pointer; }
  button:hover { border-color: var(--visor-accent, #1a6cc4); }
  #ok { color: var(--visor-green, #2e8a2e); }
</style>
</head>
<body>
<h1>Test de prueba</h1>
<p>Antes de responder, ejecuta en una terminal:</p>
<pre>visor events --wait 300</pre>
<p><strong>¿Qué mide la frecuencia de una onda?</strong></p>
<button data-respuesta="a">a) La altura de la onda</button>
<button data-respuesta="b">b) Los ciclos por segundo</button>
<button data-respuesta="c">c) La distancia entre dos crestas</button>
<p id="ok" role="status"></p>
<script>
  for (const button of document.querySelectorAll("button")) {
    button.onclick = () => {
      visor.send({ test: "ondas", pregunta: 1, respuesta: button.dataset.respuesta });
      document.getElementById("ok").textContent = "Enviada. Mira la terminal.";
    };
  }
</script>
</body>
</html>
