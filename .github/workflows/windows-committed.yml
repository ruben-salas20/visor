name: "W3: URL comprometida en WebView2"

on:
  workflow_dispatch:
  push:
    branches: [worktree-port-multiplataforma]
    paths:
      - "spikes/w3-committed/**"
      - ".github/workflows/windows-committed.yml"

permissions:
  contents: read

jobs:
  w3:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar WebView2 Runtime
        id: webview2
        run: |
          $clave = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $rutas = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clave",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$clave"
          )
          $version = $null
          foreach ($ruta in $rutas) {
            $pv = (Get-ItemProperty -Path $ruta -Name pv -ErrorAction SilentlyContinue).pv
            if ($pv) { $version = $pv; break }
          }
          if (-not $version) {
            Write-Host "WebView2 Runtime no encontrado: se instala con el bootstrapper."
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent', '/install' -Wait
            $version = (Get-ItemProperty -Path $rutas[0] -Name pv -ErrorAction SilentlyContinue).pv
          }
          Write-Host "WebView2 Runtime: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Instalar Rust
        run: rustup show

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/w3-committed

      - name: Compilar
        run: cargo build --release --manifest-path spikes/w3-committed/Cargo.toml

      - name: Ejecutar casos
        id: w3
        run: |
          $salida = Join-Path $env:RUNNER_TEMP 'w3'
          New-Item -ItemType Directory -Force -Path $salida | Out-Null
          & spikes/w3-committed/target/release/w3-committed.exe $salida
          exit $LASTEXITCODE

      - name: Resumen
        if: always()
        run: |
          $md = Join-Path $env:RUNNER_TEMP 'w3\w3-resultados.md'
          "## W3: URL comprometida en WebView2" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "WebView2 Runtime: ${{ steps.webview2.outputs.version }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path $md) {
            Get-Content $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "No se generó el informe: el experimento no llegó a ejecutarse." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-resultados
          path: ${{ runner.temp }}/w3
          if-no-files-found: warn
