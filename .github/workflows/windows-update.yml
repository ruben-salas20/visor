# Pruebas de la actualización (src/update.rs) en Windows. Corre solo esas pruebas,
# sin esperar a las de los demás módulos, que aún tienen todo!() de otras tareas.
name: Windows update (tarea C)

on:
  workflow_dispatch:
  push:
    branches: ["port-update"]
    paths:
      - "src/update.rs"
      - "src/platform/**"
      - "src/ui/visor.rs"
      - "Cargo.toml"
      - "spikes/w1-check/**"
      - ".github/workflows/windows-update.yml"

permissions:
  contents: read

jobs:
  update:
    name: pruebas de update en Windows
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The update module runs curl.exe with these arguments; check that it is there.
      - name: Comprobar curl.exe
        run: |
          set -euo pipefail
          command -v curl.exe
          curl.exe --version | head -n 1

      # Read-only query to GitHub: checks TLS and the JSON the update reads.
      - name: Consultar la última versión (solo lectura)
        run: |
          set -euo pipefail
          curl.exe -fsSL --max-time 20 -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ruben-salas20/visor/releases/latest \
            | python -c "import json,sys; r=json.load(sys.stdin); print(r['tag_name'], [a['name'] for a in r['assets']])"

      - name: Preparar la copia sin interfaz
        run: |
          set -euo pipefail
          python spikes/w1-check/prepare.py "$RUNNER_TEMP/w-update"

      - name: Pruebas de update
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/update-test.txt"
          cd "$RUNNER_TEMP/w-update"
          # cargo's exit code fails the job when a test fails.
          cargo test update:: 2>&1 | tee "$out"
          code=${PIPESTATUS[0]}
          {
            echo "## Pruebas de update en Windows"
            echo
            echo '```'
            grep -E "^test |^test result|panicked at" "$out" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
