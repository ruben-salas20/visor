# Experimento W1 (docs/plan-multiplataforma.md): cuánto de visor compila en Windows sin la interfaz.
# Los errores de compilación son el resultado, no un fallo del trabajo: solo falla si fallan los scripts.
name: Windows check (W1)

on:
  workflow_dispatch:
  push:
    branches: [worktree-port-multiplataforma, "port-*"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "spikes/w1-check/**"
      - ".github/workflows/windows-check.yml"

permissions:
  contents: read

jobs:
  w1:
    name: cargo check sin interfaz
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar las pasadas y escribir el resumen
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/w1"
          mkdir -p "$out"
          rustc -V
          cargo -V

          # cargo puede fallar (es el resultado), pero prepare.py y classify.py
          # deben funcionar, o el paso falla.
          pasada() {
            local nombre="$1" titulo="$2"
            shift 2
            local dir="$RUNNER_TEMP/w1-$nombre"
            python spikes/w1-check/prepare.py "$dir" "$@"
            (cd "$dir" && cargo check --message-format=json > "$out/$nombre-cargo.json" 2> "$out/$nombre-cargo.err") \
              || echo "cargo de la pasada $nombre sale con código $? (se clasifica abajo)"
            python spikes/w1-check/classify.py --stderr "$out/$nombre-cargo.err" < "$out/$nombre-cargo.json" > "$out/$nombre-informe.md"
            { echo "## Pasada $nombre: $titulo"; echo; cat "$out/$nombre-informe.md"; } >> "$out/resumen.md"
          }

          pasada sin-interfaz "sin interfaz, con las costuras de src/platform/"

          # Tests that reach a todo!() stub panic: the list of failures is the
          # Windows work still left, not a broken job.
          dir="$RUNNER_TEMP/w1-sin-interfaz"
          (cd "$dir" && cargo test --no-fail-fast -- --show-output > "$out/test.txt" 2>&1) || echo "cargo test sale con código $?"
          {
            echo "## cargo test en Windows (sin interfaz)"
            echo
            echo '```'
            grep -E "^test result|FAILED|panicked at|8.3 names|short name of" "$out/test.txt" | head -n 80
            echo '```'
          } >> "$out/resumen.md"

          cat "$out/resumen.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-windows-check
          if-no-files-found: error
          path: ${{ runner.temp }}/w1
