name: W2 webviews (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/w2-webviews/**"
      - ".github/workflows/windows-webviews.yml"

permissions:
  contents: read

jobs:
  medir:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: spikes/w2-webviews
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar WebView2 Runtime
        id: runtime
        run: |
          $clave = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          if (-not $pv) {
            Write-Host 'WebView2 Runtime no encontrado; instalando el bootstrapper.'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process -Wait -FilePath "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent','/install'
            $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          }
          Write-Host "WebView2 Runtime pv: $pv"
          "pv=$pv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/w2-webviews

      - name: Compilar (release)
        run: cargo build --release

      # Control: el ejemplo multiwebview de wry 0.57 (4 webviews), con límite externo de 60 s.
      - name: Control wry (multiwebview sin cambios, 60 s)
        run: |
          New-Item -ItemType Directory -Force -Path resultados | Out-Null
          $p = Start-Process -FilePath .\target\release\control_wry.exe -PassThru -NoNewWindow `
            -RedirectStandardOutput 'resultados\control.stdout.txt' -RedirectStandardError 'resultados\control.stderr.txt'
          Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) {
            taskkill /T /F /PID $p.Id | Out-Null
            Set-Content -Path 'resultados\control.estado.txt' -Value 'colgado' -Encoding utf8
          } else {
            if ($p.ExitCode -eq 0) { $estado = 'ok' } else { $estado = "salida $($p.ExitCode)" }
            Set-Content -Path 'resultados\control.estado.txt' -Value $estado -Encoding utf8
          }

      # Barrido reducido: contexto y secuencial, N = 1 y 2 (el resto ya se sabe que se cuelga).
      - name: Medir (contexto secuencial, N = 1 y 2)
        run: |
          New-Item -ItemType Directory -Force -Path resultados | Out-Null
          foreach ($n in 1, 2) {
            $modo = 'contexto'; $crear = 'secuencial'
            $base = "resultados\w2-$modo-$crear-$n"
            # Límite externo de 90 s: si vence, se mata el árbol y el paso sigue con el resto.
            $p = Start-Process -FilePath .\target\release\w2-webviews.exe `
              -ArgumentList @("$n", "$base.json", '--modo', $modo, '--crear', $crear) -PassThru -NoNewWindow `
              -RedirectStandardOutput "$base.stdout.txt" -RedirectStandardError "$base.stderr.txt"
            Wait-Process -Id $p.Id -Timeout 90 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) {
              Write-Host "w2 $modo $crear N=$n colgado; matando el árbol de procesos"
              taskkill /T /F /PID $p.Id | Out-Null
              Set-Content -Path "$base.estado.txt" -Value 'colgado' -Encoding utf8
              continue
            }
            if ($p.ExitCode -eq 0) { $estado = 'ok' } else { $estado = "salida $($p.ExitCode)" }
            Set-Content -Path "$base.estado.txt" -Value $estado -Encoding utf8
          }

      - name: Resumen
        run: |
          $filas = @(
            '| Modo | Crear | N | estado | procesos hijos | procesos msedgewebview2 | working set total (MB) | private bytes total (MB) | MB por webview adicional (private) | carga máx. (ms) | redimensionado |',
            '|---|---|---|---|---|---|---|---|---|---|---|'
          )
          $errores = @()
          $combos = @()
          foreach ($n in 1, 2) { $combos += , @('contexto', 'secuencial', $n) }
          $total1 = @{}
          foreach ($c in $combos) {
            $modo = $c[0]; $crear = $c[1]; $n = $c[2]
            $clave = "$modo/$crear"
            $base = "resultados\w2-$modo-$crear-$n"
            $estado = 'sin estado'
            if (Test-Path "$base.estado.txt") { $estado = (Get-Content "$base.estado.txt" -Raw).Trim() }
            $d = $null
            if (Test-Path "$base.json") { $d = Get-Content "$base.json" -Raw | ConvertFrom-Json }
            $m = if ($d) { $d.medida } else { $null }
            $ws = 'n/d'; $pb = 'n/d'; $extra = 'n/d'; $hijos = 'n/d'; $wv2 = 'n/d'; $carga = 'n/d'; $redim = 'n/d'
            if ($m -and -not $m.error) {
              $hijos = $m.procesos_hijos
              $wv2 = $m.procesos_msedgewebview2
              $ws = [math]::Round($m.working_set_total_bytes / 1MB, 1)
              $pb = [math]::Round($m.private_bytes_total / 1MB, 1)
              if ($n -eq 1) { $total1[$clave] = $m.private_bytes_total }
              elseif ($total1.ContainsKey($clave)) { $extra = [math]::Round(($m.private_bytes_total - $total1[$clave]) / ($n - 1) / 1MB, 1) }
            }
            if ($d -and $d.tiempo_carga_ms) { $carga = [math]::Round($d.tiempo_carga_ms) }
            if ($d) { $redim = if ($d.redimensionado_ok) { 'ok' } else { 'FALLO' } }
            if ($d -and $d.error) { $errores += "- ${modo} ${crear} N=${n}: $($d.error)" }
            $filas += "| $modo | $crear | $n | $estado | $hijos | $wv2 | $ws | $pb | $extra | $carga | $redim |"
          }
          $cabecera = "WebView2 Runtime pv: ${{ steps.runtime.outputs.pv }}"
          $ctrl = 'sin estado'
          if (Test-Path 'resultados\control.estado.txt') { $ctrl = (Get-Content 'resultados\control.estado.txt' -Raw).Trim() }
          $bloque = @($cabecera, '', "Control wry (4 webviews, sin cambios): $ctrl", '')
          if (Test-Path 'resultados\control.stderr.txt') {
            $bloque += '', 'Control, últimas líneas de stderr:', '```'
            $bloque += (Get-Content 'resultados\control.stderr.txt' -Tail 15)
            $bloque += '```'
          }
          $bloque += '', $filas
          if ($errores.Count -gt 0) { $bloque += '', 'Errores:', $errores }
          ($bloque -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-resultados
          path: spikes/w2-webviews/resultados/
          if-no-files-found: warn
