name: W2 webviews (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/w2-webviews/**"
      - ".github/workflows/windows-webviews.yml"

permissions:
  contents: read

jobs:
  medir:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: spikes/w2-webviews
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar WebView2 Runtime
        id: runtime
        run: |
          $clave = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          if (-not $pv) {
            Write-Host 'WebView2 Runtime no encontrado; instalando el bootstrapper.'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process -Wait -FilePath "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent','/install'
            $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          }
          Write-Host "WebView2 Runtime pv: $pv"
          "pv=$pv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/w2-webviews

      - name: Compilar (release)
        run: cargo build --release

      # Bisección: cada variante de control_wry cambia una sola cosa respecto al ejemplo de wry 0.57.
      # control_tao es el mismo ejemplo portado a tao 0.37. Límite externo de 60 s por ejecución.
      - name: Controles (bisección, 60 s cada uno)
        run: |
          New-Item -ItemType Directory -Force -Path resultados | Out-Null
          $ejecuciones = @(
            @{ binario = 'control_wry'; variante = 'base' },
            @{ binario = 'control_wry'; variante = 'ipc' },
            @{ binario = 'control_wry'; variante = 'contexto' },
            @{ binario = 'control_wry'; variante = 'bounds_rejilla' },
            @{ binario = 'control_tao'; variante = 'base' }
          )
          foreach ($e in $ejecuciones) {
            $base = "resultados\$($e.binario)-$($e.variante)"
            $argumentos = @()
            if ($e.binario -eq 'control_wry') { $argumentos = @('--variante', $e.variante) }
            $p = Start-Process -FilePath ".\target\release\$($e.binario).exe" -ArgumentList $argumentos -PassThru -NoNewWindow `
              -RedirectStandardOutput "$base.stdout.txt" -RedirectStandardError "$base.stderr.txt"
            Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) {
              taskkill /T /F /PID $p.Id | Out-Null
              Set-Content -Path "$base.estado.txt" -Value 'colgado' -Encoding utf8
            } else {
              if ($p.ExitCode -eq 0) { $estado = 'ok' } else { $estado = "salida $($p.ExitCode)" }
              Set-Content -Path "$base.estado.txt" -Value $estado -Encoding utf8
            }
          }

      - name: Resumen
        run: |
          $filas = @(
            '| binario | variante | estado |',
            '|---|---|---|'
          )
          $fallos = @()
          $ejecuciones = @(
            @{ binario = 'control_wry'; variante = 'base' },
            @{ binario = 'control_wry'; variante = 'ipc' },
            @{ binario = 'control_wry'; variante = 'contexto' },
            @{ binario = 'control_wry'; variante = 'bounds_rejilla' },
            @{ binario = 'control_tao'; variante = 'base' }
          )
          foreach ($e in $ejecuciones) {
            $base = "resultados\$($e.binario)-$($e.variante)"
            $estado = 'sin estado'
            if (Test-Path "$base.estado.txt") { $estado = (Get-Content "$base.estado.txt" -Raw).Trim() }
            $filas += "| $($e.binario) | $($e.variante) | $estado |"
            if ($estado -ne 'ok') {
              $fallos += ''
              $fallos += "Últimas líneas de stderr de $($e.binario) $($e.variante) ($estado):"
              $fallos += '```'
              if (Test-Path "$base.stderr.txt") { $fallos += (Get-Content "$base.stderr.txt" -Tail 15) }
              $fallos += '```'
            }
          }
          $bloque = @("WebView2 Runtime pv: ${{ steps.runtime.outputs.pv }}", '') + $filas + $fallos
          ($bloque -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-resultados
          path: spikes/w2-webviews/resultados/
          if-no-files-found: warn
