name: W2 webviews (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/w2-webviews/**"
      - ".github/workflows/windows-webviews.yml"

permissions:
  contents: read

jobs:
  medir:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: spikes/w2-webviews
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar WebView2 Runtime
        id: runtime
        run: |
          $clave = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          if (-not $pv) {
            Write-Host 'WebView2 Runtime no encontrado; instalando el bootstrapper.'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process -Wait -FilePath "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent','/install'
            $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          }
          Write-Host "WebView2 Runtime pv: $pv"
          "pv=$pv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/w2-webviews

      - name: Compilar (release)
        run: cargo build --release

      # Control: el ejemplo multiwebview de wry 0.57 portado a tao 0.37, con tres formas de esperar del bucle.
      # Límite externo de 60 s por ejecución.
      - name: Controles tao (base, poll, espera; 60 s cada uno)
        run: |
          New-Item -ItemType Directory -Force -Path resultados | Out-Null
          foreach ($variante in 'base', 'poll', 'espera') {
            $base = "resultados\control_tao-$variante"
            $p = Start-Process -FilePath .\target\release\control_tao.exe -ArgumentList @('--variante', $variante) -PassThru -NoNewWindow `
              -RedirectStandardOutput "$base.stdout.txt" -RedirectStandardError "$base.stderr.txt"
            Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) {
              taskkill /T /F /PID $p.Id | Out-Null
              Set-Content -Path "$base.estado.txt" -Value 'colgado' -Encoding utf8
            } else {
              if ($p.ExitCode -eq 0) { $estado = 'ok' } else { $estado = "salida $($p.ExitCode)" }
              Set-Content -Path "$base.estado.txt" -Value $estado -Encoding utf8
            }
          }

      # The tao hang is intermittent (run 38948535407 hung, 38949242448 did not): count it.
      - name: Repeticiones (control_tao y control_wry base, 10 veces cada uno)
        run: |
          $filas = @('### Repeticiones', '', '| binario | ok | bloqueado (4) | colgado | otra salida |', '|---|---|---|---|---|')
          foreach ($bin in 'control_tao', 'control_wry') {
            $c = @{ ok = 0; v4 = 0; colgado = 0; otra = 0 }
            foreach ($i in 1..10) {
              $base = "resultados\rep-$bin-$i"
              $p = Start-Process -FilePath ".\target\release\$bin.exe" -ArgumentList @('--variante', 'base') -PassThru -NoNewWindow `
                -RedirectStandardOutput "$base.stdout.txt" -RedirectStandardError "$base.stderr.txt"
              Wait-Process -Id $p.Id -Timeout 60 -ErrorAction SilentlyContinue
              if (-not $p.HasExited) { taskkill /T /F /PID $p.Id | Out-Null; $c.colgado++ }
              elseif ($p.ExitCode -eq 0) { $c.ok++ }
              elseif ($p.ExitCode -eq 4) { $c.v4++ }
              else { $c.otra++ }
            }
            $filas += "| $bin | $($c.ok) | $($c.v4) | $($c.colgado) | $($c.otra) |"
          }
          ($filas + '') -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $filas -join "`n" | Out-File -FilePath resultados\repeticiones.md -Encoding utf8

      # Medición con winit: modos contexto y entorno, N = 1, 5 y 10. Límite externo de 90 s por ejecución.
      - name: Medir (winit, contexto y entorno, N = 1, 5 y 10)
        run: |
          New-Item -ItemType Directory -Force -Path resultados | Out-Null
          foreach ($modo in 'contexto', 'entorno') {
            foreach ($n in 1, 5, 10) {
              $base = "resultados\w2-$modo-$n"
              $p = Start-Process -FilePath .\target\release\w2-webviews.exe `
                -ArgumentList @("$n", "$base.json", '--modo', $modo) -PassThru -NoNewWindow `
                -RedirectStandardOutput "$base.stdout.txt" -RedirectStandardError "$base.stderr.txt"
              Wait-Process -Id $p.Id -Timeout 90 -ErrorAction SilentlyContinue
              if (-not $p.HasExited) {
                Write-Host "w2 $modo N=$n colgado; matando el árbol de procesos"
                taskkill /T /F /PID $p.Id | Out-Null
                Set-Content -Path "$base.estado.txt" -Value 'colgado' -Encoding utf8
                continue
              }
              if ($p.ExitCode -eq 0) { $estado = 'ok' } else { $estado = "salida $($p.ExitCode)" }
              Set-Content -Path "$base.estado.txt" -Value $estado -Encoding utf8
            }
          }

      - name: Resumen
        run: |
          $salida = @("WebView2 Runtime pv: ${{ steps.runtime.outputs.pv }}", '')
          $fallos = @()

          $salida += '### Controles tao', '', '| binario | variante | estado |', '|---|---|---|'
          foreach ($variante in 'base', 'poll', 'espera') {
            $base = "resultados\control_tao-$variante"
            $estado = 'sin estado'
            if (Test-Path "$base.estado.txt") { $estado = (Get-Content "$base.estado.txt" -Raw).Trim() }
            $salida += "| control_tao | $variante | $estado |"
            if ($estado -ne 'ok') {
              $fallos += '', "Últimas líneas de stderr de control_tao $variante ($estado):", '```'
              if (Test-Path "$base.stderr.txt") { $fallos += (Get-Content "$base.stderr.txt" -Tail 15) }
              $fallos += '```'
            }
          }

          $salida += '', '### Medición winit', ''
          $salida += '| modo | N | estado | procesos | WS total (MB) | privada total (MB) | MB por webview adicional | carga máx. (ms) | redimensionado |'
          $salida += '|---|---|---|---|---|---|---|---|---|'
          foreach ($modo in 'contexto', 'entorno') {
            $privada1 = $null
            foreach ($n in 1, 5, 10) {
              $base = "resultados\w2-$modo-$n"
              $estado = 'sin estado'
              if (Test-Path "$base.estado.txt") { $estado = (Get-Content "$base.estado.txt" -Raw).Trim() }
              $d = $null
              if (Test-Path "$base.json") { $d = Get-Content "$base.json" -Raw | ConvertFrom-Json }
              $m = if ($d) { $d.medida } else { $null }
              $hijos = 'n/d'; $ws = 'n/d'; $pb = 'n/d'; $extra = 'n/d'; $carga = 'n/d'; $redim = 'n/d'
              if ($m -and -not $m.error) {
                $hijos = $m.procesos_hijos
                $ws = [math]::Round($m.working_set_total_bytes / 1MB, 1)
                $pb = [math]::Round($m.private_bytes_total / 1MB, 1)
                if ($n -eq 1) { $privada1 = $m.private_bytes_total }
                elseif ($null -ne $privada1) { $extra = [math]::Round(($m.private_bytes_total - $privada1) / ($n - 1) / 1MB, 1) }
              }
              if ($d -and $d.tiempo_carga_ms) { $carga = [math]::Round($d.tiempo_carga_ms) }
              if ($d) { $redim = if ($d.redimensionado_ok) { 'ok' } else { 'FALLO' } }
              $salida += "| $modo | $n | $estado | $hijos | $ws | $pb | $extra | $carga | $redim |"
              if ($estado -ne 'ok') {
                $fallos += '', "Últimas líneas de stderr de w2 $modo N=$n ($estado):", '```'
                if (Test-Path "$base.stderr.txt") { $fallos += (Get-Content "$base.stderr.txt" -Tail 15) }
                $fallos += '```'
              }
            }
          }

          $salida += $fallos
          ($salida -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-resultados
          path: spikes/w2-webviews/resultados/
          if-no-files-found: warn
