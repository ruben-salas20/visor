name: U1 marco HTML (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/u1-windows/**"
      - ".github/workflows/windows-u1.yml"

permissions:
  contents: read

jobs:
  probar:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: spikes/u1-windows
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar WebView2 Runtime
        id: runtime
        run: |
          $clave = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          if (-not $pv) {
            Write-Host 'WebView2 Runtime no encontrado; instalando el bootstrapper.'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
            Start-Process -Wait -FilePath "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent','/install'
            $pv = (Get-ItemProperty -Path $clave -Name pv -ErrorAction SilentlyContinue).pv
          }
          Write-Host "WebView2 Runtime pv: $pv"
          "pv=$pv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/u1-windows

      - name: Compilar (release)
        run: cargo build --release

      # a) five times, b-d once. External limit of 120 s per run; the program gives up at 60 s.
      - name: Ejecutar pruebas
        run: |
          New-Item -ItemType Directory -Force -Path resultados | Out-Null
          $ejecuciones = @('a-1', 'a-2', 'a-3', 'a-4', 'a-5', 'b-1', 'c-1', 'd-1')
          foreach ($nombre in $ejecuciones) {
            $prueba = $nombre.Split('-')[0]
            $base = "resultados\$nombre"
            $p = Start-Process -FilePath .\target\release\u1-windows.exe `
              -ArgumentList @('--auto', "$base.json", '--prueba', $prueba) -PassThru -NoNewWindow `
              -RedirectStandardOutput "$base.stdout.txt" -RedirectStandardError "$base.stderr.txt"
            Wait-Process -Id $p.Id -Timeout 120 -ErrorAction SilentlyContinue
            if (-not $p.HasExited) {
              taskkill /T /F /PID $p.Id | Out-Null
              $estado = 'colgado'
            } elseif ($p.ExitCode -eq 0) { $estado = 'ok' }
            else { $estado = "salida $($p.ExitCode)" }
            Write-Host "$nombre -> $estado"
            Set-Content -Path "$base.estado.txt" -Value $estado -Encoding utf8
          }

      - name: Resumen
        if: always()
        run: |
          $salida = @("WebView2 Runtime pv: ${{ steps.runtime.outputs.pv }}", '', '| ejecución | estado | ok | motivo | dato |', '|---|---|---|---|---|')
          $cuenta = @{ ok = 0; colgado = 0; otra = 0 }
          foreach ($f in Get-ChildItem resultados\*.estado.txt | Sort-Object Name) {
            $nombre = $f.Name -replace '\.estado\.txt$', ''
            $estado = (Get-Content $f.FullName -Raw).Trim()
            $d = $null
            if (Test-Path "resultados\$nombre.json") { $d = Get-Content "resultados\$nombre.json" -Raw | ConvertFrom-Json }
            $dato = ''
            if ($d -and $nombre -like 'b-*') { $dato = "rechazos de hostil: $($d.evidencia.rechazos_de_hostil); confirmada: $($d.evidencia.url_confirmada_pagina_1)" }
            if ($d -and $nombre -like 'c-*' -and $d.evidencia.resumen) {
              $r = $d.evidencia.resumen
              $dato = 'privada MB/página extra {0:N1}; WS MB/página extra {1:N1}; procesos {2} -> {3}; privada {4:N0} -> {5:N0} MB' -f $r.mb_private_bytes_por_pagina_extra, $r.mb_working_set_por_pagina_extra, $r.procesos_2, $r.procesos_5, $r.mb_private_bytes_2, $r.mb_private_bytes_5
            }
            if ($d -and $nombre -like 'd-*' -and $d.evidencia.pasos) {
              $dato = ($d.evidencia.pasos | ForEach-Object { "$($_.pedido_logico -join 'x'): ok=$($_.ok) tamaño=$($_.ventana_tomo_el_tamano)" }) -join '; '
            }
            if ($d -and $nombre -like 'a-*') { $dato = "listo $($d.tiempos_ms.listo) ms; cargadas $($d.tiempos_ms.cargada_0)/$($d.tiempos_ms.cargada_1) ms" }
            $salida += "| $nombre | $estado | $(if ($d) { $d.ok } else { 'sin JSON' }) | $(if ($d) { $d.motivo } else { '' }) | $dato |"
            if ($nombre -like 'a-*') {
              if ($estado -eq 'ok') { $cuenta.ok++ } elseif ($estado -eq 'colgado') { $cuenta.colgado++ } else { $cuenta.otra++ }
            }
          }
          $salida += '', "Prueba a (5 repeticiones): ok $($cuenta.ok), colgado $($cuenta.colgado), otra salida $($cuenta.otra)"
          $salida -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $salida -join "`n" | Out-File -FilePath resultados\resumen.md -Encoding utf8
          $salida -join "`n" | Write-Host

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u1-windows-resultados
          path: spikes/u1-windows/resultados/
